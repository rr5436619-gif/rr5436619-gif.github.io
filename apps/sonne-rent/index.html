<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sonne Rent — نظام تأجير السيارات</title>
<meta name="author" content="Rabie Al Mehtar – Sonne Apps">
<!-- © 2026 Rabie Al Mehtar – Sonne Apps. Alle Rechte vorbehalten. جميع الحقوق محفوظة. -->
<style>
:root{--p:#0f62fe;--pd:#0b4fd1;--bg:#f4f6fa;--c:#fff;--t:#1d2433;--m:#6b7486;--bd:#e3e7ef;--g:#14a44d;--r:#dc3545;--rad:14px}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;background:var(--bg);color:var(--t);font-size:15px;line-height:1.5}
a{color:var(--p);text-decoration:none;cursor:pointer}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;display:inline-block;white-space:nowrap;text-align:center}
.btn:hover{background:var(--pd)}
.btn.ghost{background:#eef3ff;color:var(--p)}
.btn.ghost:hover{background:#dfe9ff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.wide{width:100%;margin-top:8px}
.shell{display:flex;min-height:100vh}
aside{width:250px;flex-shrink:0;background:#121a2b;color:#cfd6e4;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px;font-size:17px;color:#fff}
.brand img,.lg{width:38px;height:38px;border-radius:10px;object-fit:cover;display:grid;place-items:center;background:var(--p);font-size:20px;flex-shrink:0}
aside nav{flex:1;overflow:auto;padding:6px 10px}
aside nav a{display:flex;align-items:center;gap:10px;color:#cfd6e4;padding:10px 12px;border-radius:10px;margin-bottom:2px}
aside nav a.on,aside nav a:hover{background:#1f2b45;color:#fff}
aside nav i{font-style:normal;width:22px;text-align:center}
em{font-style:normal;background:var(--r);color:#fff;border-radius:20px;padding:0 7px;font-size:12px;margin-inline-start:auto}
.me{padding:14px 18px;border-top:1px solid #23304d;display:flex;flex-direction:column;gap:6px;color:#fff}
.me small{color:#8d98b0}
main{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--c);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top h1{font-size:19px;margin:0;flex:1}
.menu{display:none;background:none;border:0;font-size:24px;cursor:pointer;padding:0 4px}
.bell{position:relative;font-size:20px}
.bell em{position:absolute;top:-6px;left:-12px}
#pg{padding:22px;max-width:1300px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:var(--rad);padding:18px;margin-bottom:18px}
.card h3{margin:0 0 14px;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--c);border:1px solid var(--bd);border-radius:var(--rad);padding:16px;display:grid;gap:4px}
.kpi i{font-style:normal;font-size:22px}
.kpi span{color:var(--m);font-size:13px}
.kpi b{font-size:21px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.grid2>.card{margin-bottom:0}
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:4px}
.bar div{width:100%;max-width:46px;background:linear-gradient(var(--p),#5b8ffe);border-radius:8px 8px 0 0;min-height:2px}
.bar span{font-size:12px;color:var(--m)}
.bar small{font-size:11px}
.tw{overflow-x:auto;background:var(--c);border:1px solid var(--bd);border-radius:var(--rad);margin-bottom:18px}
.card .tw{border:0;margin:0;border-radius:0}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--bd);vertical-align:middle}
th{background:#f8fafd;font-size:13px;color:var(--m);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.nw{white-space:nowrap}
.bdg{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.bdg.g{background:#e4f6ea;color:var(--g)}
.bdg.o{background:#fff1de;color:#b86a00}
.bdg.r{background:#fde7e9;color:var(--r)}
.bdg.b{background:#e6efff;color:var(--p)}
.bdg.x{background:#eceef2;color:#5b6375}
.bar-top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
.bar-top input{flex:1;max-width:340px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff;color:var(--t)}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd3ff;border-color:var(--p)}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.car{background:var(--c);border:1px solid var(--bd);border-radius:var(--rad);overflow:hidden;display:flex;flex-direction:column}
.car img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eef2f7;display:block}
.cb{padding:14px;display:grid;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-size:20px;font-weight:700;color:var(--p)}
.price small{font-size:13px;color:var(--m);font-weight:400}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a{padding:7px 13px;border-radius:20px;background:var(--c);border:1px solid var(--bd);color:var(--t);font-size:14px}
.tabs a.on{background:var(--p);color:#fff;border-color:var(--p)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);color:var(--t)}
.li:last-child{border:0}
.li small{display:block}
.mut{color:var(--m)}
.sm{font-size:13px}
.empty{color:var(--m);text-align:center;padding:26px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.kv div{display:grid;gap:2px}
.mod{position:fixed;inset:0;background:rgba(15,22,40,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
.mbox{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:640px}
.mbox h3{margin-top:0}
form#frm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:grid;gap:5px;align-content:start}
.fld>span{font-size:13px;color:var(--m);font-weight:600}
.fld.full,.mbox .acts,.calc{grid-column:1/-1}
.chk{display:inline-flex;align-items:center;gap:6px;margin:3px 0 3px 12px;font-size:14px}
.chk input{width:auto}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:70px;height:52px;object-fit:cover;border-radius:8px}
.thumbs.big img{width:140px;height:100px}
.calc{background:#eef3ff;border-radius:10px;padding:10px 14px;font-weight:600}
.calc:empty{display:none}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#121a2b;color:#fff;padding:12px 18px;border-radius:12px;z-index:99;max-width:90vw;text-align:center}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,#121a2b,#0f62fe)}
.login .card{width:100%;max-width:380px;display:grid;gap:10px;text-align:center}
.login .lg,.login .card img{margin:auto;width:56px;height:56px}
.login h2{margin:4px 0 0}
.ov{display:none}
.pub .ph{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:#121a2b;flex-wrap:wrap;gap:10px}
.pub .ph nav a{color:#fff;margin-inline-start:16px;opacity:.75}
.pub .ph nav a.on{opacity:1;font-weight:700}
.pub .brand{padding:0}
.pub .brand small{display:block;color:#9aa6bf;font-size:12px}
.hero{background:linear-gradient(135deg,#121a2b,#0f62fe);color:#fff;text-align:center;padding:42px 18px}
.hero h1{margin:0 0 8px;font-size:28px}
.hero p{margin:0;opacity:.85}
.pubc{padding:22px;max-width:1200px;margin:auto}
.narrow{max-width:520px;margin:30px auto}
.pf{text-align:center;padding:24px;color:var(--m);font-size:13px}
.inv .ih{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.inv h2{margin:6px 0}
.to{margin-bottom:14px}
.tots{max-width:330px;margin:14px auto 0 0;display:grid;gap:6px}
.tots div{display:flex;justify-content:space-between;gap:20px}
.tots .g{font-size:18px;border-top:2px solid var(--t);padding-top:6px}
@media(max-width:900px){
 .grid2{grid-template-columns:1fr}
 aside{position:fixed;right:-270px;z-index:40;transition:right .25s}
 aside.open{right:0}
 .ov.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
 .menu{display:block}
 #pg{padding:14px}
 form#frm{grid-template-columns:1fr}
 .top .btn{display:none}
 .hero h1{font-size:22px}
}
@media print{
 body{background:#fff}
 body *{visibility:hidden}
 #print,#print *{visibility:visible}
 #print{position:absolute;inset:0;border:0;margin:0}
 aside,.top{display:none}
}
.demo{background:#ffc629;color:#14181f;text-align:center;padding:10px 16px;font-weight:600;font-size:14px}.demo a{color:#14181f;text-decoration:underline}[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const K='sonne_rent_v1';
/* إعداد النشر لكل عميل: ضع هنا رابط ومفتاح Supabase الخاص بشركته ليعمل الموقع على كل الأجهزة */
/* © 2026 Rabie Al Mehtar – Sonne Apps, Berlin. Alle Rechte vorbehalten / جميع الحقوق محفوظة.
   Nutzung nur mit gültiger Lizenz. Kopie, Weitergabe oder Weiterverkauf ohne schriftliche Genehmigung verboten. */
const DEMO_ONLY=true;
const EMBED={url:'',key:''};
let S=null,ME=null,FORM=null,ASKFN=null;
const app=document.getElementById('app');
const $=s=>document.querySelector(s);

/* ---------- ثوابت ---------- */
const MODS=[['dash','لوحة التحكم','📊'],['fleet','الأسطول','🚗'],['status','حالة السيارات','🔧'],['customers','العملاء','👥'],['bookings','الحجوزات','📅'],['handover','التسليم والاستلام','🔑'],['invoices','الفواتير والمدفوعات','🧾'],['accidents','بلاغات الحوادث','⚠️'],['notify','التنبيهات','🔔'],['reports','التقارير','📈'],['users','المستخدمون والصلاحيات','🛡️'],['settings','الإعدادات','⚙️']];
const PRESETS={admin:MODS.map(m=>m[0]),ops:['dash','fleet','status','customers','bookings','handover','accidents','notify'],acc:['dash','customers','invoices','reports','notify']};
const ROLES={admin:'مدير النظام',ops:'فريق التشغيل',acc:'المحاسب',custom:'صلاحيات مخصصة'};
const CST={available:['متاحة','g'],reserved:['محجوزة','b'],rented:['مؤجرة','o'],maint:['صيانة','r'],out:['خارج الخدمة','x']};
const BST={new:['جديد','b'],confirmed:['مؤكد','g'],active:['جاري','o'],done:['منتهي','x'],cancelled:['ملغي','r']};
const IST={open:['غير مدفوعة','r'],part:['مدفوعة جزئياً','o'],paid:['مدفوعة','g'],cancelled:['ملغاة (ستورنو)','x'],storno:['فاتورة إلغاء','x']};
const ACST={new:['جديد','r'],progress:['قيد المعالجة','o'],closed:['مغلق','g']};
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

/* ---------- أدوات ---------- */
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return x.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const addD=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return iso(x)};
const dif=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const dd=(a,b)=>Math.max(1,dif(a,b));
const num=n=>(+n||0).toLocaleString('en-US');
const money=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+S.settings.currency;
const fd=d=>d?String(d).slice(0,10).split('-').reverse().join('.'):'—';
const fdt=d=>d?fd(d)+' '+new Date(d).toTimeString().slice(0,5):'—';
const badge=(m,k)=>`<span class="bdg ${m[k]?m[k][1]:'x'}">${m[k]?m[k][0]:esc(k)}</span>`;
const carName=id=>(S.cars.find(c=>c.id===id)||{}).name||'';
const cuName=id=>(S.customers.find(c=>c.id===id)||{}).name||'';
const bkNo=id=>(S.bookings.find(b=>b.id===id)||{}).no||'—';
const norm=s=>String(s||'').replace(/[\s-]/g,'').toUpperCase();
const digits=p=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d=(S.settings.cc||'49')+d.slice(1);return d};
const wa=(p,t)=>`https://wa.me/${digits(p)}${t?'?text='+encodeURIComponent(t):''}`;
const empty=t=>`<div class="empty">${t||'لا توجد بيانات بعد'}</div>`;
const logoHtml=()=>S.settings.logo?`<img src="${S.settings.logo}" alt="">`:'<span class="lg">🚗</span>';
const cell=c=>c&&typeof c==='object'&&'h' in c?c.h:esc(c);
const tbl=(cols,rows)=>rows.length?`<div class="tw"><table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${cell(c)}</td>`).join('')}</tr>`).join('')}</table></div>`:empty();
async function h(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sonne-rent:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p:'+p}}
function save(){if(SB){if(ME)queuePush();return}try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('تعذّر الحفظ — قد تكون مساحة المتصفح ممتلئة بالصور. خذ نسخة احتياطية واحذف صوراً قديمة.')}}
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3800)}
function showModal(html){let m=$('#mod');if(!m){m=document.createElement('div');m.id='mod';m.className='mod';document.body.appendChild(m)}m.innerHTML=`<div class="mbox">${html}</div>`;m.style.display='flex';m.scrollTop=0}
function closeModal(){const m=$('#mod');if(m)m.style.display='none'}
function ask(msg,fn){ASKFN=fn;showModal(`<p>${msg}</p><div class="acts"><button class="btn" onclick="closeModal();ASKFN()">نعم</button><button class="btn ghost" onclick="closeModal()">لا</button></div>`)}
function go(r){const t='#'+r.replace('/','-');if(location.hash===t)render();else location.hash=t}
const sub=()=>location.hash.slice(1).replace(/^\//,'').split(/[-/]/)[1];
function filt(inp,sel){const q=inp.value.trim().toLowerCase();document.querySelectorAll(sel).forEach(e=>e.style.display=(e.dataset.s||'').toLowerCase().includes(q)?'':'none')}
function can(m){return !!ME&&(ME.role==='admin'||(ME.perms||[]).includes(m))}
function openSide(){$('#side').classList.add('open');$('.ov').classList.add('open')}
function closeSide(){const s=$('#side');if(s){s.classList.remove('open');$('.ov').classList.remove('open')}}
function carSvg(c){return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><rect width="320" height="180" fill="#eef2f7"/><ellipse cx="165" cy="152" rx="130" ry="8" fill="#d5dbe5"/><path d="M38 122 L58 88 Q68 72 90 70 L198 68 Q224 68 240 84 L266 102 Q292 106 292 122 L292 136 L38 136 Z" fill="${c}"/><path d="M96 78 L194 76 Q212 76 225 92 L90 94 Z" fill="#d6e7f7"/><rect x="150" y="76" width="5" height="18" fill="${c}"/><circle cx="95" cy="136" r="21" fill="#222"/><circle cx="95" cy="136" r="9" fill="#bbb"/><circle cx="236" cy="136" r="21" fill="#222"/><circle cx="236" cy="136" r="9" fill="#bbb"/><rect x="276" y="110" width="14" height="7" rx="3" fill="#ffe27a"/></svg>`)}

/* ---------- الصور ---------- */
function resize(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
function thumbs(v){return (Array.isArray(v)?v:v?[v]:[]).map(s=>`<img src="${s}" alt="">`).join('')}
function pickImg(inp,k,multi){Promise.all([...inp.files].map(resize)).then(arr=>{arr=arr.filter(Boolean);FORM.vals[k]=multi?[...(FORM.vals[k]||[]),...arr]:arr[0];document.getElementById('th_'+k).innerHTML=thumbs(FORM.vals[k])})}

/* ---------- النماذج ---------- */
function fieldHtml(f,v){const req=f.req?'required':'';let inp;
 switch(f.t){
 case 'select':inp=`<select name="${f.k}" ${req}>${f.o.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v??'')?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;break;
 case 'textarea':inp=`<textarea name="${f.k}" ${req}>${esc(v)}</textarea>`;break;
 case 'image':inp=`<input type="file" accept="image/*" ${f.multi?'multiple':''} onchange="pickImg(this,'${f.k}',${!!f.multi})"><div class="thumbs" id="th_${f.k}">${thumbs(v)}</div>`;break;
 case 'checks':inp=`<div>${f.o.map(([val,lab])=>`<label class="chk"><input type="checkbox" name="${f.k}" value="${esc(val)}" ${(v||[]).includes(val)?'checked':''}> ${esc(lab)}</label>`).join('')}</div>`;break;
 case 'check':inp=`<label class="chk"><input type="checkbox" name="${f.k}" ${v?'checked':''} ${req}> ${f.cl||''}</label>`;break;
 default:inp=`<input type="${f.t||'text'}" name="${f.k}" value="${esc(v)}" ${req} ${f.t==='number'?'step="any"':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;}
 return `<label class="fld ${f.w?'full':''}">${f.l?`<span>${f.l}${f.req&&f.t!=='check'?' *':''}</span>`:''}${inp}</label>`}
function openForm(title,fields,vals,onSave,extra){FORM={fields,onSave,vals:{...vals},live:null};
 showModal(`<h3>${title}</h3><form id="frm" onsubmit="return submitForm(event)" oninput="FORM.live&&FORM.live(this)">${fields.map(f=>fieldHtml(f,vals[f.k])).join('')}${extra||''}<div class="acts"><button class="btn">حفظ</button><button type="button" class="btn ghost" onclick="closeModal()">إلغاء</button></div></form>`)}
async function submitForm(e){e.preventDefault();const F=new FormData(e.target),v={};
 for(const f of FORM.fields){if(f.t==='checks')v[f.k]=F.getAll(f.k);else if(f.t==='check')v[f.k]=F.has(f.k);else if(f.t==='image')v[f.k]=FORM.vals[f.k]||(f.multi?[]:'');else if(f.t==='number')v[f.k]=F.get(f.k)===''?'':+F.get(f.k);else v[f.k]=String(F.get(f.k)||'').trim()}
 const r=await FORM.onSave(v);if(r===false)return false;closeModal();save();render();return false}

/* ---------- منطق الحجز ---------- */
function clash(carId,s,e,ex){return S.bookings.some(b=>b.id!==ex&&b.carId===carId&&['new','confirmed','active'].includes(b.status)&&s<b.end&&e>b.start)}
function upsertCustomer(name,phone){const d=digits(phone);let c=S.customers.find(x=>digits(x.phone)===d);if(!c){c={id:uid(),name,phone,created:new Date().toISOString()};S.customers.push(c)}return c.id}
function makeBooking(o){if(!o.start||!o.end||o.end<=o.start)return 'تاريخ الإرجاع يجب أن يكون بعد تاريخ الاستلام';
 if(!o.force&&clash(o.carId,o.start,o.end,o.id))return 'السيارة محجوزة في هذه الفترة، اختر سيارة أو تاريخاً آخر';
 const car=S.cars.find(c=>c.id===o.carId);if(!car)return 'اختر سيارة';const days=dd(o.start,o.end);

/* ---------- تقارير ---------- */
function monthly(){const r=[],d=new Date();for(let k=5;k>=0;k--){const x=new Date(d.getFullYear(),d.getMonth()-k,1);const key=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');r.push([MN[x.getMonth()],S.payments.filter(p=>String(p.date).startsWith(key)).reduce((a,p)=>a+(+p.amount||0),0)])}return r}
function bars(data){const max=Math.max(...data.map(x=>x[1]),0);return `<div class="bars">${data.map(([l,v])=>`<div class="bar"><small>${num(Math.round(v))}</small><div style="height:${max?v/max*85:0}%"></div><span>${esc(l)}</span></div>`).join('')}</div>`}
function ovl(s,e,f,t){const a=s>f?s:f,b=e<t?e:t;return Math.max(0,dif(a,b))}
function csv(name,head,rows){const q=x=>`"${String(x??'').replace(/"/g,'""')}"`;dl(name+'-'+today()+'.csv','﻿'+[head,...rows].map(r=>r.map(q).join(';')).join('\n'),'text/csv')}
function dl(n,t,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

 S.maint.push({id:uid(),carId:'c4',date:d(-1),type:'إصلاح هيكل',km:27500,cost:420,notes:'إصلاح الصدام الأمامي'},{id:uid(),carId:'c1',date:d(-60),type:'زيت وفلاتر',km:15000,cost:180,notes:''});
 S.accidents.push({id:uid(),date:d(-3),created:new Date().toISOString(),source:'online',status:'progress',carId:'c4',bookingId:'',reporter:'سارة يوسف',phone:'01761112233',location:'Berlin, A100',desc:'اصطدام خفيف من الخلف عند الإشارة، لا توجد إصابات.',police:'',third:'',photos:[],cost:420});
 return S}

/* ---------- الربط السحابي (Supabase) ---------- */
const COLLS=['cars','customers','bookings','handovers','invoices','payments','accidents','maint','users'];
let SB=null,SNAP={},LAST=null,PT=null,PUSHING=false,AGAIN=false,TIMER=null,SYNC=['ok',''];
function DEFSET(){return {name:'Sonne Rent',slogan:'تأجير سيارات بسهولة',address:'Berlin, Germany',phone:'+49 30 0000000',email:'info@example.com',taxId:'',iban:'',opsWa:'4915100000000',cc:'49',currency:'€',vat:'19',kmPerDay:200,extraKm:0.25,fuelFee:12,payLink:'',terms:'الحد الأدنى لعمر السائق 21 سنة ورخصة قيادة سارية منذ سنة على الأقل. التأمين (الكفالة) يُسترد عند إرجاع السيارة بحالة سليمة.',impressum:'',logo:'',demo:false}}
function blank(st){return {v:1,cnt:{bk:0,inv:0},settings:st||DEFSET(),users:[],cars:[],customers:[],bookings:[],handovers:[],invoices:[],payments:[],accidents:[],maint:[]}}
function cloudCfg(){if(EMBED.url&&EMBED.key)return EMBED;try{return JSON.parse(localStorage.getItem(K+'_cloud'))||{}}catch(e){return {}}}
function loadLib(){const src=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4','https://unpkg.com/@supabase/supabase-js@2.45.4'];
 return new Promise((res,rej)=>{if(window.supabase&&window.supabase.createClient)return res();const tryN=n=>{if(n>=src.length)return rej(new Error('تعذّر تحميل مكتبة الربط — تحقق من الإنترنت'));const s=document.createElement('script');s.src=src[n];s.onload=()=>window.supabase&&window.supabase.createClient?res():tryN(n+1);s.onerror=()=>tryN(n+1);document.head.appendChild(s)};tryN(0)})}
function syncBadge(){if(!SB)return '';const[m,c]={ok:['☁️ متزامن','g'],busy:['☁️ جارٍ الحفظ…','b'],err:['⚠️ غير متزامن — اضغط','r']}[SYNC[0]];return `<a id="sync" class="bdg ${c}" title="${esc(SYNC[1])}" onclick="pull()">${m}</a>`}
function setSync(st,msg){SYNC=[st,msg||''];const e=$('#sync');if(e)e.outerHTML=syncBadge()}
function queuePush(){setSync('busy');clearTimeout(PT);PT=setTimeout(push,700)}
const modalOpen=()=>{const m=$('#mod');return !!m&&m.style.display==='flex'};
function snapSet(c,id,v){(SNAP[c]=SNAP[c]||{})[id]=v}
async function push(){clearTimeout(PT);PT=null;if(!SB||!ME)return;if(PUSHING){AGAIN=true;return}PUSHING=true;let renum=false;
 try{
  for(const b of S.bookings)if(b.tmpNo){const{data,error}=await SB.rpc('rent_next_no',{p_k:'bk'});if(error)throw error;b.no='BK-'+String(data).padStart(4,'0');delete b.tmpNo;renum=true}
  for(const i of S.invoices)if(i.tmpNo){const y=String(i.date).slice(0,4);const{data,error}=await SB.rpc('rent_next_no',{p_k:'inv'+y});if(error)throw error;i.no=`RE-${y}-${String(data).padStart(4,'0')}`;delete i.tmpNo;renum=true}
  const rows=[];
  const add=(c,arr)=>{const seen=new Set();for(const r of arr){seen.add(r.id);const j=JSON.stringify(r);if(!SNAP[c]||SNAP[c][r.id]!==j)rows.push({coll:c,id:r.id,data:r,deleted:false,_j:j})}for(const id in SNAP[c]||{})if(!seen.has(id))rows.push({coll:c,id,data:{},deleted:true})};
  COLLS.forEach(c=>add(c,S[c]));add('settings',[{...S.settings,id:'settings'}]);
  for(let x=0;x<rows.length;x+=100){const part=rows.slice(x,x+100);const{error}=await SB.from('rent_records').upsert(part.map(({_j,...r})=>r));if(error)throw error;part.forEach(r=>{if(r.deleted){if(SNAP[r.coll])delete SNAP[r.coll][r.id]}else snapSet(r.coll,r.id,r._j)})}
  setSync('ok')
 }catch(e){setSync('err',e.message||String(e));toast('تعذّر الحفظ في السحابة: '+(e.message||e))}
 PUSHING=false;if(AGAIN){AGAIN=false;return push()}if(renum&&!modalOpen())render()}
async function pull(){if(!SB)return;if(ME&&(PT||PUSHING))await push();
 const since=LAST;let max=LAST,changed=false,reqs=[];
 for(let from=0;;from+=1000){let q=SB.from('rent_records').select('coll,id,data,deleted,updated_at').order('updated_at').range(from,from+999);if(since)q=q.gt('updated_at',since);
  const{data,error}=await q;if(error){setSync('err',error.message);return}
  for(const r of data){if(!max||r.updated_at>max)max=r.updated_at;
   if(r.coll==='requests'){if(!r.deleted)reqs.push(r);continue}
   if(r.coll==='settings'){if(!r.deleted){S.settings=r.data;snapSet('settings','settings',JSON.stringify(r.data));changed=true}continue}
   if(!COLLS.includes(r.coll))continue;const arr=S[r.coll],ix=arr.findIndex(x=>x.id===r.id);
   if(r.deleted){if(ix>=0)arr.splice(ix,1);if(SNAP[r.coll])delete SNAP[r.coll][r.id]}else{if(ix>=0)arr[ix]=r.data;else arr.push(r.data);snapSet(r.coll,r.id,JSON.stringify(r.data))}changed=true}
  if(data.length<1000)break}
 LAST=max;
 if(ME){ME=S.users.find(u=>u.id===ME.id)||ME;if(reqs.length&&await takeReqs())changed=true}
 if(SYNC[0]==='err'&&!PT)setSync('ok');
 if(changed&&ME&&!modalOpen()&&document.activeElement.tagName!=='INPUT')render()}
async function takeReqs(){if(!(can('bookings')||can('accidents')))return 0;const{data:rs}=await SB.from('rent_records').select('id,data').eq('coll','requests').eq('deleted',false);let n=0;
 for(const r of rs||[]){const{data}=await SB.from('rent_records').update({deleted:true,data:{}}).eq('coll','requests').eq('id',r.id).eq('deleted',false).select('id');if(data&&data.length){takeReq(r.data);n++}}
 if(n){save();toast(`وصل ${n} طلب جديد من صفحة العملاء`)}return n}
function takeReq(d){
 if(d.kind==='booking'){const cid=upsertCustomer(d.name,d.phone);const o={customerId:cid,carId:d.carId,start:d.start,end:d.end,source:'online',notes:'طلب أونلاين '+d.code};let b=makeBooking(o);if(typeof b==='string')makeBooking({...o,force:true,notes:'⚠️ تعارض مع حجز آخر — راجع قبل التأكيد. طلب '+d.code})}
 else if(d.kind==='accident'){const c=S.cars.find(x=>norm(x.plate)===norm(d.plate)),act=c&&S.bookings.find(b=>b.carId===c.id&&b.status==='active');S.accidents.push({id:uid(),date:d.date||today(),created:new Date().toISOString(),source:'online',status:'new',carId:c?c.id:'',bookingId:act?act.id:'',reporter:d.reporter,phone:d.phone,plate:d.plate,location:d.location,desc:d.desc,photos:d.photos||[]})}}
async function cloudLogin(email,pass){const{error}=await SB.auth.signInWithPassword({email,password:pass});if(error){toast('بيانات الدخول غير صحيحة');return}await afterAuth(email)}
async function afterAuth(email){email=String(email).toLowerCase();const st=S.settings;S=blank(st);SNAP={};LAST=null;ME=null;await pull();
 let u=S.users.find(x=>String(x.user).toLowerCase()===email&&x.active!==false);
 if(!u&&!S.users.some(x=>String(x.user).includes('@'))){u={id:uid(),name:'المدير',user:email,role:'admin',perms:PRESETS.admin,active:true};S.users.push(u);ME=u;save()}
 if(!u){toast('حسابك غير مضاف في النظام أو موقوف. اطلب من المدير إضافة بريدك.');await SB.auth.signOut();return renderLogin()}
 ME=u;try{sessionStorage.setItem(K+'_me',u.id)}catch(e){}await takeReqs();clearInterval(TIMER);TIMER=setInterval(pull,20000);
 const r=location.hash.slice(1).replace(/^\//,'');if(!r||/^(login|book|report)/.test(r))go(r.startsWith('book')||r.startsWith('report')?r:'dash');else render()}
async function loadPublic(){const{data,error}=await SB.from('rent_records').select('coll,id,data').in('coll',['cars','settings']).eq('deleted',false);if(error)throw error;for(const r of data){if(r.coll==='settings')S.settings=r.data;else S.cars.push(r.data)}}
async function cloudBook(car,v){const{data,error}=await SB.rpc('rent_busy',{car:car.id});if(error){toast('خطأ في الاتصال، حاول مرة أخرى');return false}
 if((data||[]).some(x=>v.start<x.e&&v.end>x.s)){toast('السيارة محجوزة في هذه الفترة، اختر تاريخاً آخر');return false}
 const code=uid().slice(-6).toUpperCase(),days=dd(v.start,v.end);
 const{error:e2}=await SB.from('rent_records').insert({coll:'requests',deleted:false,id:'rq'+uid(),data:{kind:'booking',code,carId:car.id,name:v.name,phone:v.phone,start:v.start,end:v.end}});
 if(e2){toast('تعذّر إرسال الطلب، حاول مرة أخرى');return false}
 setTimeout(()=>doneBook({no:code,car,start:v.start,end:v.end,days,total:days*car.price,deposit:+car.deposit||0,name:v.name,phone:v.phone}),50)}
function doneBook(b){const msg=`🚗 طلب حجز ${b.no}\nالعميل: ${b.name}\nالهاتف: ${b.phone}\nالسيارة: ${b.car.name} (${b.car.plate})\nمن ${fd(b.start)} إلى ${fd(b.end)} — ${b.days} يوم\nالمبلغ: ${money(b.total)}`;
 showModal(`<h3>✅ تم استلام طلب الحجز</h3><p>رقم الطلب: <b>${esc(b.no)}</b><br>${esc(b.car.name)} · ${fd(b.start)} ← ${fd(b.end)}<br>المبلغ: <b>${money(b.total)}</b>${b.deposit?` + تأمين مسترد ${money(b.deposit)}`:''}</p>${S.settings.demo&&!SB?'<p class="sm">هذا حجز تجريبي ✅ ظهر الآن في لوحة الموظفين. اضغط «دخول الموظفين» وادخل بـ admin / admin123 لتراه وتؤكده.</p><a class="btn wide" href="#login">دخول الموظفين</a>':''}<p class="sm" ${S.settings.demo&&!SB?'hidden':''}>خطوة أخيرة: اضغط الزر لإرسال الطلب لفريقنا عبر واتساب ليتم تأكيده بسرعة.</p><a class="btn wide" ${S.settings.demo&&!SB?'hidden':''} target="_blank" href="${wa(S.settings.opsWa,msg)}">📲 إرسال الطلب عبر واتساب</a><button class="btn ghost wide" onclick="closeModal()">إغلاق</button>`)}
function cloudCard(){const c=cloudCfg();return `<div class="card"><h3>☁️ الربط السحابي (عدة أجهزة وموظفين)</h3>${SB?`<p><span class="bdg g">متصل بقاعدة البيانات</span> <span class="mut sm" dir="ltr">${esc(c.url)}</span></p><div class="acts"><button class="btn ghost" onclick="migrate()">⬆️ نقل البيانات المحلية من هذا المتصفح إلى السحابة</button>${EMBED.url?'':'<button class="btn ghost" onclick="cloudOff()">فصل الربط</button>'}</div>`:`<p class="mut sm">الوضع الحالي: محلي (هذا المتصفح فقط). بعد إنشاء قاعدة بيانات Supabase وتشغيل ملف setup.sql، أدخل بياناتها هنا ليعمل النظام على كل الأجهزة.</p><button class="btn" onclick="cloudForm()">ربط بقاعدة البيانات</button>`}</div>`}
function cloudForm(){openForm('ربط قاعدة بيانات Supabase',[{k:'url',l:'Project URL',req:1,w:1,ph:'https://xxxx.supabase.co'},{k:'key',l:'anon public key',req:1,w:1}],cloudCfg(),async v=>{
 try{await loadLib();const t=window.supabase.createClient(v.url,v.key);const{error}=await t.from('rent_records').select('id').limit(1);if(error)throw error}catch(e){toast('فشل الاتصال: '+(e.message||e)+' — هل شغّلت ملف setup.sql؟');return false}
 try{localStorage.setItem(K+'_cloud',JSON.stringify({url:v.url.trim(),key:v.key.trim()}))}catch(e){}toast('تم الربط. سجّل الدخول ببريد المدير.');setTimeout(()=>{location.hash='#login';location.reload()},800)})}
function cloudOff(){ask('فصل الربط والعودة للوضع المحلي؟ البيانات في السحابة تبقى كما هي.',()=>{try{localStorage.removeItem(K+'_cloud')}catch(e){}if(SB)SB.auth.signOut();setTimeout(()=>location.reload(),300)})}
function migrate(){let L=null;try{L=JSON.parse(localStorage.getItem(K))}catch(e){}if(!L||!L.cars)return toast('لا توجد بيانات محلية في هذا المتصفح');
 ask(`نقل ${L.cars.length} سيارة و${L.bookings.length} حجز و${L.invoices.length} فاتورة إلى السحابة؟ ستُستبدل بيانات السحابة (عدا المستخدمين).`,async()=>{const users=S.users;S={...blank(L.settings),...L,users};S.settings={...L.settings,demo:false};
  await SB.rpc('rent_set_no',{p_k:'bk',p_n:(L.cnt&&L.cnt.bk)||0});await SB.rpc('rent_set_no',{p_k:'inv'+new Date().getFullYear(),p_n:(L.cnt&&L.cnt.inv)||0});save();render();toast('جارٍ رفع البيانات…')})}
function cloudFail(e){app.innerHTML=`<div class="login"><div class="card"><h2>تعذّر الاتصال بقاعدة البيانات</h2><p class="mut">${esc(e.message||e)}</p><button class="btn wide" onclick="location.reload()">إعادة المحاولة</button>${EMBED.url?'':'<button class="btn ghost wide" onclick="cloudOff()">العمل محلياً بدون سحابة</button>'}</div></div>`}
window.addEventListener('focus',()=>{if(SB&&ME)pull()});

/* ---------- تشغيل ---------- */
(async()=>{const cfg=DEMO_ONLY?{}:cloudCfg();
 if(cfg.url&&cfg.key){try{await loadLib();SB=window.supabase.createClient(cfg.url,cfg.key);S=blank();await loadPublic();
   const{data}=await SB.auth.getSession();if(data&&data.session)return afterAuth(data.session.user.email);return render()}catch(e){return cloudFail(e)}}
 try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}if(!S||!S.cars){S=await seed();save()}if(DEMO_ONLY)S.settings.demo=true;let id=null;try{id=sessionStorage.getItem(K+'_me')}catch(e){}ME=S.users.find(u=>u.id===id&&u.active!==false)||null;render()})();

</script>
